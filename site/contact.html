<body>

     <form action="post" id="form"><!--formulaire de contact-->

<br>

    <input type="text" name="prenom" placeholder="Entrez votre prenom">  <!--placeholder : texte d’exemple affiché quand le champ est vide.--> <!--name= permet de relier a une class-->
 <br> 
<br> 
<br>    
    <input type="email" name="email" id="email" step="1" required> <label for="email">Email </label> <!--email-->
<br>
<br> 
<br> 
              <!--checkbox = plussieur choix possible--> <!--value= valeur -->

  <input type="submit"/><!--Bouton envoyer-->

    </form>
