<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script><!--Tailwind-->
      <link rel="stylesheet" href="./Contact.css"><!--Chemin direction -->
    <title>Document</title>
</head>
  <body>     
    <form action="post" id="form" class="m-4 p-4 "><!--formulaire de contact-->
     <fieldset><legend class="text-xl font-bold text-center">Formulaire de contact</legend> <h2></h2><!--fielset= encadrement et legend = titre au milieux de l'encadrement-->
<br>
<br>  
    <input type="text" name="nom" placeholder="Entrez votre nom" required>  <!--placeholder : texte d’exemple affiché quand le champ est vide.--> <!--name= permet de relier a une class-->
<br> 
<br> 
<br>    
    <input type="text" name="prenom" placeholder="Entrez votre prenom" required>  <!--placeholder : texte d’exemple affiché quand le champ est vide.--> <!--name= permet de relier a une class-->
 <br> 
<br> 
<br>    
    <input type="email" name="email" id="email" step="1" required> <!--email-->
<br>
<br> 
<br> 
              <!--checkbox = plussieur choix possible--> <!--value= valeur -->
<br><fieldset><legend class="">Choix</legend>
                      <input id="Javascript" type="radio"><label for="Javascript">Javascript</label>  <!---->
<br>
                        <input id="PHP" type="radio"><label for="PHP">PHP</label>  
<br>
                        <input id="c#" type="radio"><label for="c#">c#</label>  
<br>
                        <input id="RUBY" type="radio"><label for="RUBY">RUBY</label>  
<br>
                        <input id="REACT" type="radio">REACT<label for="REACT">REACT</label> 
<br>
                        <input id="NODEJS" type="radio">NODEJS<label for="NODEJS">NODEJS</label> 
<br>
          <select><!--select=permet de rajouter une liste qui défile-->
            <option value="homme"> homme </option> <!--option=permet de rajouter des choix dans la liste (ne pas oublier de ne pas les laisser vide)-->
                <option value="femme">femme</option>
                         <option value="femme">je ne suis pas encore certain</option>
            </select> 
    </fieldset>
<br>
<textarea id="texte" name="texte" rows="6" cols="50" placeholder="message ici..." class="items-center"></textarea><!--tailwind-->
<br>
<br>
  <input type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-full shadow-md transition hover:scale-105 my-4"/><!--Bouton envoyer-->
<br>
<br>
    </form>
    <script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
